name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
# Force JavaScript actions onto the current, supported Node 24 runtime (Node 20 is
# deprecated/being removed for security); applies to every job and step below.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Suppress Material's advisory banner about a future/hostile "MkDocs 2.0" (we are pinned to the
  # supported MkDocs 1.6.x + Material 9.7.x line; there is no usable 2.0 to upgrade to). Official gate.
  NO_MKDOCS_2_WARNING: "true"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: mkdocs build --clean
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
